<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Drive Authentication</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
      color: white;
    }
    .container {
      text-align: center;
      padding: 2.5rem;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 1.25rem;
      backdrop-filter: blur(12px);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.15);
      max-width: 400px;
    }
    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top: 3px solid white;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      animation: spin 1s linear infinite;
      margin: 0 auto 1.25rem;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .error {
      background: rgba(239, 68, 68, 0.25);
      border: 1px solid rgba(239, 68, 68, 0.5);
      padding: 1rem;
      border-radius: 0.75rem;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h2 style="margin: 0 0 0.5rem 0;">Connecting Google Drive...</h2>
    <p id="status" style="margin: 0; opacity: 0.9; font-size: 0.9rem;">Please wait while we authenticate...</p>
  </div>

  <script type="module">
    (async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      const state = urlParams.get('state');
      const error = urlParams.get('error');

      if (error) {
        document.getElementById('status').innerHTML = `
          <div class="error">
            Authentication failed: ${error}
          </div>
        `;
        setTimeout(() => {
          window.close();
        }, 3000);
        return;
      }

      if (!code) {
        document.getElementById('status').innerHTML = `
          <div class="error">
            No authorization code received
          </div>
        `;
        setTimeout(() => {
          window.close();
        }, 3000);
        return;
      }

      try {
        document.getElementById('status').textContent = 'Connecting with Escrow Ledger...';
        
        if (window.opener) {
          window.opener.postMessage({
            type: 'GOOGLE_DRIVE_AUTH_CODE',
            code,
            state,
          }, window.location.origin);
          
          localStorage.setItem('google_drive_auth_code', code);
          localStorage.setItem('google_drive_auth_state', state || '');
          localStorage.setItem('google_drive_auth_timestamp', Date.now().toString());
          
          setTimeout(() => {
            window.close();
          }, 800);
        } else {
          localStorage.setItem('google_drive_auth_code', code);
          localStorage.setItem('google_drive_auth_state', state || '');
          localStorage.setItem('google_drive_auth_timestamp', Date.now().toString());
          
          document.getElementById('status').innerHTML = `
            <div style="background: rgba(34, 197, 94, 0.25); border: 1px solid rgba(34, 197, 94, 0.5); padding: 1rem; border-radius: 0.75rem; margin-top: 1rem;">
              Authentication successful!<br>You can return to Escrow Ledger.
            </div>
          `;
          setTimeout(() => {
            window.close();
          }, 2500);
        }
      } catch (e) {
        console.error('PostMessage error:', e);
        try {
          localStorage.setItem('google_drive_auth_code', code);
          localStorage.setItem('google_drive_auth_state', state || '');
          localStorage.setItem('google_drive_auth_timestamp', Date.now().toString());
        } catch (storageError) {}
        
        document.getElementById('status').innerHTML = `
          <div class="error">
            Failed to communicate with app. Please close this window.
          </div>
        `;
        setTimeout(() => {
          window.close();
        }, 3000);
      }
    })();
  </script>
</body>
</html>
